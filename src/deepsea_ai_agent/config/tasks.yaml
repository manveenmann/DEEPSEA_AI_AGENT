research_task:
  description: |
    Research the assigned deep-sea subject by analyzing:
    - environmental conditions
    - marine life and ecosystems
    - geological structures
    - historical expeditions
    - scientific discoveries
    - emerging research findings

    Use reliable scientific and educational sources to identify
    important patterns, discoveries, ecological significance,
    technological innovations, unexplored mysteries,
    and future research opportunities.

    Maintain scientific accuracy while keeping explanations
    clear and educational.

  expected_output: |
    A structured markdown research report containing:

    - Executive summary
    - Historical background
    - Scientific analysis
    - Major discoveries
    - Expedition methods
    - Environmental insights
    - Key researchers
    - Challenges and unanswered questions
    - Future implications

    Use clear headings, concise explanations,
    and evidence-based educational storytelling.

  agent: researcher


reporting_analyst:
  description: |
    Convert the research findings into a visually organized,
    engaging, and easy-to-understand educational report.

    Improve readability using clear structure,
    simplified explanations, storytelling flow,
    and visual presentation suggestions.

  expected_output: |
    A polished markdown report containing:

    - Title page
    - Table of contents
    - Section summaries
    - Visual and infographic suggestions
    - Highlight sections
    - Simplified explanations
    - Presentation-ready formatting

    Ensure the report is visually clear,
    educational, and audience-friendly.

  agent: strategist